<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>پالس بازار</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"/>
<style>
 :root{--card:#131c31;--line:#22304d;--txt:#e8eefc;--dim:#8fa3c8;--up:#f87171;--down:#34d399;--acc:#60a5fa}
 *{box-sizing:border-box}
 body{margin:0;background:linear-gradient(180deg,#0b1120,#0f172a 40%);color:var(--txt);font-family:Vazirmatn,system-ui,sans-serif;min-height:100vh;padding:20px 14px 40px}
 header{max-width:980px;margin:0 auto 18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
 h1{font-size:22px;margin:0;font-weight:800}
 .meta{color:var(--dim);font-size:13px}
 .btn{margin-inline-start:auto;background:#1d4ed8;border:0;color:#fff;border-radius:9px;padding:7px 14px;font:inherit;font-size:12.5px;cursor:pointer}
 main{max-width:980px;margin:0 auto}
 .grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));margin-bottom:18px}
 .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
 .card::after{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--acc);opacity:.55}
 .card .lbl{color:var(--dim);font-size:12.5px;margin-bottom:7px}
 .card .val{font-size:20px;font-weight:700}
 .card .chg{font-size:12px;margin-top:5px;color:var(--dim)}
 .up{color:var(--up)}.down{color:var(--down)}
 .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
 .panel h2{font-size:15px;margin:0 0 4px;font-weight:700}
 .panel .sub{color:var(--dim);font-size:12px;margin-bottom:12px}
 svg{width:100%;height:230px;display:block}
 .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
 .tab{background:#18233d;border:1px solid var(--line);color:var(--dim);border-radius:9px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
 .tab.on{background:#1d4ed8;border-color:#3b82f6;color:#fff}
 footer{max-width:980px;margin:18px auto 0;color:#55688c;font-size:11.5px;text-align:center;line-height:1.9}
</style></head><body>
<header><h1>📊 پالس بازار</h1><span class="meta" id="stamp">—</span>
<button class="btn" onclick="refresh()">↻ دریافت زنده</button></header>
<main><div class="grid" id="grid"></div>
<div class="panel"><h2>روند <span id="chartName">دلار آمریکا</span></h2>
<div class="sub" id="chartSub">—</div><div class="tabs" id="tabs"></div><div id="chartWrap"></div></div></main>
<footer>داده‌ها هر 15 دقیقه از Supabase به‌روزرسانی می‌شوند · دادهٔ بایگانی: <span id="boot"></span></footer>
<script>
const FALLBACK=null;
const CARDS=[["usd","🇺🇸","دلار آمریکا","toman"],["eur","🇪🇺","یورو اروپا","toman"],["aed","🇦🇪","درهم امارات","toman"],
["gold_18k","✨","طلای 18 عیار","toman"],["gold_mesghal","⚖️","مثقال طلا","toman"],
["gold_ounce","🌐","انس جهانی طلا","usd"],["silver_ounce","🥈","انس جهانی نقره","usd"],["silver_gram","🥈","نقرهٔ 925 (هر گرم)","toman"],["coin_emami","🟡","سکه امامی","toman"],
["coin_bahar","🟡","سکه بهار آزادی","toman"],["coin_half","🟡","نیم‌سکه","toman"],
["coin_quarter","🟡","ربع‌سکه","toman"],["coin_gram","🟡","سکه گرمی","toman"],
["oil","⛽","نفت برنت","usd"]];
const CHARTABLE=["usd","eur","aed","gold_18k","coin_emami","gold_ounce","silver_ounce","silver_gram","oil"];
const FA=s=>String(s);  // digits stay Latin everywhere
const NF=n=>FA(Math.round(n).toLocaleString("en-US"));
let cur="usd",data=FALLBACK||{market:{},history:{}};
function curData(){return data.history&&data.history[cur]?data:{market:data.market||{},history:{[cur]:[]}}}
function pct(d){const p=(d.history||[]).map(h=>Number(h.price));return p.length>1?((p.at(-1)-p[0])/p[0])*100:0}
function render(){
 const cd=curData();const m=cd.market||{};
 document.getElementById("stamp").textContent="آخرین بروزرسانی: "+((cd.date_shamsi||"")+" — "+FA((cd.updated_at||"").slice(11,16)));
 document.getElementById("chartName").textContent=(CARDS.find(c=>c[0]===cur)||[])[2]||cur;
 document.getElementById("grid").innerHTML=CARDS.map(([k,ico,lbl,unit])=>{
   const v=m[k];const shown=v==null?"—":(unit==="toman"?NF(v)+" <small style='font-size:12px;color:#8fa3c8'>تومان</small>":FA(v)+" <small style='font-size:12px;color:#8fa3c8'>دلار</small>");
   const chg=k===cur?pct(cd):null;
   return `<div class="card"><div class="lbl">${ico} ${lbl}</div><div class="val">${shown}</div>${chg===null?"":`<div class="chg ${chg>=0?"up":"down"}">${chg>=0?"▲":"▼"} ${Math.abs(chg).toFixed(2)}%</div>`}</div>`;
 }).join("");
 chart();
}
function chart(){
 const cd=curData();const h=(cd.history||[]).map(x=>({t:new Date(x.ts),p:Number(x.price)}));
 const w=document.getElementById("chartWrap");
 if(h.length<2){w.innerHTML='<div class="sub">دادهٔ کافی برای نمودار نیست.</div>';document.getElementById("chartSub").textContent="—";return}
 const W=900,H=230,P={t:16,r:14,b:26,l:58};
 const ps=h.map(x=>x.p),min=Math.min(...ps),max=Math.max(...ps);
 const pad=(max-min)*0.12||1,lo=min-pad,hi=max+pad;
 const X=i=>P.l+(W-P.l-P.r)*(i/(h.length-1));
 const Y=p=>P.t+(H-P.t-P.b)*(1-(p-lo)/(hi-lo));
 const line=h.map((x,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(x.p).toFixed(1)}`).join(" ");
 const area=`${line} L${X(h.length-1).toFixed(1)},${H-P.b} L${X(0).toFixed(1)},${H-P.b} Z`;
 let grid="";for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);
  grid+=`<line x1="${P.l}" y1="${y.toFixed(1)}" x2="${W-P.r}" y2="${y.toFixed(1)}" stroke="#22304d" stroke-dasharray="4 5"/><text x="${W-P.r+2}" y="${(y+4).toFixed(1)}" fill="#6f83a8" font-size="10" text-anchor="start">${FA(Math.round(v).toLocaleString("en-US"))}</text>`;}
 const lbl=h.map((x,i)=>{if(i%(Math.ceil(h.length/6))!==0&&i!==h.length-1)return"";
  const d=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Tehran",month:"2-digit",day:"2-digit"}).format(x.t);
  return `<text x="${X(i).toFixed(1)}" y="${H-8}" fill="#6f83a8" font-size="10" text-anchor="middle">${d}</text>`;}).join("");
 const li=h.length-1;
 document.getElementById("chartSub").textContent=`${h.length} نقطه · کمینه ${NF(min)} · بیشینه ${NF(max)} · تغییر کل ${Math.abs(pct(cd)).toFixed(2)}%`;
 w.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}
 <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".38"/><stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/></linearGradient></defs>
 <path d="${area}" fill="url(#g)"/><path d="${line}" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
 <circle cx="${X(li).toFixed(1)}" cy="${Y(ps.at(-1)).toFixed(1)}" r="4.5" fill="#1d4ed8" stroke="#93c5fd" stroke-width="2"/>${lbl}</svg>`;
}
async function refresh(){
 const b=document.querySelector(".btn");b.textContent="در حال دریافت…";
 try{const r=await fetch("data.json?r="+Math.random(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);
  data=await r.json();render();b.textContent="↻ دریافت زنده";}
 catch(e){b.textContent="خطا: "+e.message+" (از دادهٔ بایگانی)";}
}
document.getElementById("tabs").innerHTML=CHARTABLE.map(s=>`<button class="tab ${s===cur?"on":""}" data-s="${s}">${(CARDS.find(c=>c[0]===s)||[])[2]||s}</button>`).join("");
document.getElementById("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;cur=b.dataset.s;
 [...document.querySelectorAll(".tab")].forEach(t=>t.classList.toggle("on",t===b));render();};
document.getElementById("boot").textContent=FA(((data&&data.updated_at)||"").slice(0,10));
render();refresh();setInterval(refresh,900000);
render();
</script></body></html>
